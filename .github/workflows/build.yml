name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    if: github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.version-check.outputs.new-version }}
      version-changed: ${{ steps.version-check.outputs.version-changed }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        id: version-check
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          # Auto-increment patch if tag already exists
          while git tag -l "v$VERSION" | grep -q "v$VERSION"; do
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            VERSION="$(echo "$VERSION" | cut -d. -f1-2).$((PATCH + 1))"
          done
          echo "new-version=$VERSION" >> $GITHUB_OUTPUT
          echo "version-changed=true" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build:
    runs-on: ubuntu-latest
    needs: [version]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install TailwindCSS
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.18/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Build CSS
        run: tailwindcss -i ./app/static/css/input.css -o ./app/static/css/style.css --minify

      - name: Ruff Lint
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"

      - uses: astral-sh/setup-uv@v7

      - name: Run tests
        run: |
          uv sync --frozen --group dev
          uv run pytest

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new-version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Scan image for CVEs
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          severity-cutoff: high
          fail-build: false
          output-format: table

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new-version }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  release:
    runs-on: ubuntu-latest
    needs: [version, build]
    if: needs.version.outputs.version-changed == 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync versions
        run: |
          VERSION=${{ needs.version.outputs.new-version }}
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Commit and tag
        run: |
          VERSION=${{ needs.version.outputs.new-version }}

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add pyproject.toml

          if ! git diff --staged --quiet; then
            git commit -m "chore: release v$VERSION [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.version.outputs.new-version }}
          name: v${{ needs.version.outputs.new-version }}
          body: |
            ## Artifacts
            - **Docker image**: `ghcr.io/${{ github.repository }}:${{ needs.version.outputs.new-version }}`
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  update-gitops:
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.version-changed == 'true'
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v6
        with:
          repository: naqa92-portfolio-projects/talos-fluxcd
          token: ${{ secrets.GITOPS_PAT }}

      - name: Setup yq
        uses: mikefarah/yq@v4

      - name: Update versions
        env:
          VERSION: ${{ needs.version.outputs.new-version }}
        run: |
          APP_DIR=apps/prod/landing-page
          IMAGE_BASE=$(yq '.spec.image' "$APP_DIR/app.yaml" | cut -d: -f1)
          yq eval -i ".spec.image = \"${IMAGE_BASE}:${VERSION}\"" "$APP_DIR/app.yaml"

      - name: Create PR
        env:
          VERSION: ${{ needs.version.outputs.new-version }}
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git switch --create release/landing-page-$VERSION

          git add apps/prod/landing-page/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(landing-page): bump to v${VERSION}"
            git push origin release/landing-page-$VERSION

            gh pr create \
              --title "chore(landing-page): bump to v${VERSION}" \
              --body "New release: \`v${VERSION}\`

          Flux will reconcile automatically after merge.

          Please review before merging to trigger the deployment." \
              --base main \
              --head release/landing-page-$VERSION \
              --repo naqa92-portfolio-projects/talos-fluxcd
          fi
