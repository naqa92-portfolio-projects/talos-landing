<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>taloslab.cc</title>
    <meta name="description" content="Cluster Kubernetes sur Hetzner. Réseau eBPF Cilium, GitOps par ArgoCD + Crossplane — zero-trust par défaut.">
    <meta name="theme-color" content="#05070B">
    {# Motif du jauge de la page, en SVG inline : pas de requête, pas de 404. #}
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230B1017'/><circle cx='16' cy='16' r='9' fill='none' stroke='%237BE8FF' stroke-width='4' stroke-linecap='round' stroke-dasharray='40 57' transform='rotate(-90 16 16)'/></svg>">
    <meta property="og:title" content="taloslab.cc">
    <meta property="og:description" content="Kubernetes cluster on Hetzner. Cilium eBPF networking, GitOps via ArgoCD + Crossplane — zero-trust by default.">
    <meta property="og:image" content="https://taloslab.cc/static/img/og.png">
    <meta property="og:url" content="https://taloslab.cc">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="taloslab.cc">
    <meta name="twitter:description" content="Kubernetes cluster on Hetzner. Cilium eBPF networking, GitOps via ArgoCD + Crossplane.">
    <meta name="twitter:image" content="https://taloslab.cc/static/img/og.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {# Bumper une version impose de recalculer son `integrity` : sur un hash périmé
       le navigateur refuse le script et la page ne signale rien. #}
    <script src="https://unpkg.com/alpinejs@3.17.2/dist/cdn.min.js" integrity="sha384-lcaMFHdvRVsEXVuhit4fTnbxq6eTLm5HPdNzO7vXNZjr8HOCMouPmv4hSGF3PCJV" crossorigin="anonymous" defer></script>
    <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@1.46.0/dist/umd/lucide.min.js" integrity="sha384-1avDoIZZ5mKtAlvTbQ2jge+TZA4z+qwhMFHdCpATww/SLVM8wKs7sROOEKMOizyV" crossorigin="anonymous"></script>
</head>
<body x-data="{ lang: localStorage.getItem('lang') || 'en' }"
      x-init="$watch('lang', val => localStorage.setItem('lang', val))"
      class="bg-void text-ink font-text antialiased">
    {% block content %}{% endblock %}
    <script>
        lucide.createIcons();
        document.body.addEventListener('htmx:afterSwap', () => lucide.createIcons());
    </script>
</body>
</html>
