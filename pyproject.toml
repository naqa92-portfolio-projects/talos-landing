[project]
name = "talos-landing"
version = "0.2.8"
description = "Landing page for taloslab.cc — live Kubernetes metrics & infrastructure showcase"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23.0",
    "kubernetes>=31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

# L'app tourne depuis son cwd (`gunicorn "app:create_app()"`), jamais installée.
[tool.uv]
package = false
